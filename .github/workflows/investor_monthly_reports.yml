name: Recopilacion mensual de inversionistas NBA

# Manda la recopilacion del mes que acaba de terminar a TODOS los
# inversionistas registrados - corre el dia 1 de cada mes a las 6:00am
# hora de Mexico (CDMX).
#
# Se puede disparar de 2 formas:
#   1. Solo, el dia 1 de cada mes (cron de abajo).
#   2. A mano desde GitHub: pestana "Actions" -> "Recopilacion mensual de
#      inversionistas NBA" -> "Run workflow" (util para probar).
#
# Mexico City es UTC-6 todo el anio (sin horario de verano desde 2022):
# 12:00 UTC del dia 1 = 06:00 CDMX del dia 1.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  enviar-reportes-mensuales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install gspread google-auth matplotlib

      - name: Escribir credenciales de Google a un archivo temporal
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > "$RUNNER_TEMP/google_creds.json"

      - name: Enviar recopilaciones mensuales
        env:
          GOOGLE_CREDENTIALS_JSON_PATH: ${{ runner.temp }}/google_creds.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python nba_send_monthly_reports.py
